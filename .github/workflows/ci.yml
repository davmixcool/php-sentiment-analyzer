name: CI

on:
  push:
    branches: [ master, 'milestone-*', '2.x' ]
  pull_request:
    branches: [ master, '2.x' ]

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run characterization suite
        run: composer test

      # The baseline must be reproducible: regenerating it on a clean checkout
      # must produce no diff. A diff here means scoring is not deterministic
      # across PHP versions, which would invalidate the v2.0 parity guarantee.
      - name: Verify baseline is reproducible
        run: |
          composer baseline
          git diff --exit-code tests/fixtures/baseline.json
